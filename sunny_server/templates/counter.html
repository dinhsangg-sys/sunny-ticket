<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bán vé tại quầy — Sunny</title><link rel="stylesheet" href="/static/css/legacy.css"><link rel="stylesheet" href="/static/css/updates.css?v=counter-preview-10"><link rel="stylesheet" href="/static/css/counter.css?v=counter-preview-10"><script src="/static/js/uuid_compat.js?v=counter-preview-2"></script></head>
<body><div class="counter-shell">{% include "counter_sidebar.html" with active="sales" %}<main class="counter-page"><header><h1>Bán vé tại quầy</h1><form method="post" action="/logout/">{% csrf_token %}<button class="btn">Đăng xuất</button></form></header>
<p id="counterIdentity"></p><p>Khách lẻ · Ngày hệ thống: <strong id="counterToday"></strong></p>
<form id="counterForm" class="card"><h2>Tạo booking</h2><div class="form"><label>Loại vé<select class="select" id="counterTicket"><option value="">Chọn loại vé...</option></select></label><label>Số lượng<input class="input" id="counterQty" type="number" min="1" max="10000" step="1" value="1" required></label><label>Giá bán / vé (đồng)<input class="input" id="counterPrice" type="number" min="0" step="1" required></label><label class="counter-vat"><input id="counterVat" type="checkbox"> Có VAT</label><label>Email khách hàng<input class="input" id="counterEmail" type="email" maxlength="254" placeholder="Không bắt buộc khi tạo booking"></label><label>Vé gốc PDF/JPEG/PNG<input class="input" id="counterSource" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" multiple><small>Có thể nhập sau khi tạo booking.</small></label><label class="full">Ghi chú<textarea class="textarea" id="counterNote" maxlength="2000"></textarea></label></div><p>Tạo booking đồng nghĩa đã thu đủ tiền khách.</p><p>Tổng tiền: <strong id="counterTotal">0 ₫</strong></p><button class="btn primary" id="counterSave">Tạo booking</button><p id="counterMessage" role="status" aria-live="polite"></p></form>
<section class="card"><h2>Booking của tôi (100 booking gần nhất)</h2><div class="tablebox"><table class="table"><thead><tr><th>Mã</th><th>Ngày</th><th>Loại vé</th><th>SL</th><th>Giá bán/vé</th><th>Tổng tiền</th><th>VAT</th><th>Ghi chú</th><th>Vé PDF / In / Email</th></tr></thead><tbody id="counterRows"></tbody></table></div><button class="btn" id="counterReload">Làm mới</button></section>
</main></div><script src="/static/js/quick_partner_search.js?v=counter-preview-10"></script><script src="/static/js/counter.js?v=counter-preview-10"></script><script src="/static/js/counter_tickets.js?v=counter-preview-10"></script><script src="/static/js/counter_details.js?v=counter-preview-10"></script></body></html>

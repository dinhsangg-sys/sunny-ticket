<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Thanh toán chuyển khoản — Sunny Travel</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.display-card{background:white;border-radius:22px;max-width:760px;width:100%;padding:30px;box-shadow:0 8px 40px #0001;text-align:center}.brand{font-size:25px;font-weight:800;color:#926d00}.amount{font-size:clamp(36px,6vw,64px);font-weight:800;margin:18px 0}.qr{width:min(380px,75vw);height:auto;margin:10px auto;display:block}.details{line-height:1.8;font-size:20px;overflow-wrap:anywhere}.state{padding:16px;background:#fff3bf;border-radius:12px;font-size:22px;font-weight:700;margin:20px 0}.state[data-state=paid]{background:#d4f5df;color:#146c35}.state[data-state=error]{background:#ffe0df;color:#8b2020}.test{padding:12px;background:#ffe0df;font-weight:800}.small{color:#687080;font-size:15px;line-height:1.5}button{padding:10px 18px;border:1px solid #ddd;border-radius:8px;background:white;cursor:pointer}</style></head><body><main class="display-card"><div class="brand">SUNNY TRAVEL</div><h1>Thanh toán chuyển khoản</h1><p id="displayTest" class="test" hidden>CHẾ ĐỘ THỬ — QR minh họa, không dùng chuyển tiền thật</p><div id="displayAmount" class="amount"></div><p id="displayBooking"></p><img id="displayQr" class="qr" alt="Mã QR chuyển khoản" hidden referrerpolicy="no-referrer"><div id="displayDetails" class="details"></div><div id="displayState" class="state" role="status">Đang tải thông tin thanh toán…</div><p id="displayCountdown" class="small"></p><p class="small">Kiểm tra số tiền và tài khoản nhận trong ứng dụng ngân hàng. Không đổi nội dung chuyển khoản. Quét QR chưa có nghĩa là đã thanh toán; chờ hệ thống xác nhận tiền vào.</p><button id="displayFullscreen" type="button">Toàn màn hình</button></main><script src="/static/js/sepay_display.js?v=1.12.2"></script></body></html>

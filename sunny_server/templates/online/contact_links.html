{% load online_tags %}{% if social_links or contact_links %}<section class="sunny-contact-links" aria-label="{% ot 'Kênh chính thức và liên hệ Sunny' 'Sunny official channels and contact' %}"><div class="channel-links">{% for link in social_links %}<a href="{{ link.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ link.label }}" title="{{ link.label }}">{% include 'online/channel_icon.html' with channel=link.label only %}</a>{% endfor %}{% for link in contact_links %}<a href="{{ link.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ link.label }}" title="{{ link.label }}">{% include 'online/channel_icon.html' with channel=link.label only %}</a>{% endfor %}</div></section>{% endif %}

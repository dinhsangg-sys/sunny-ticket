{% load online_tags %}<article class="service-card"><a href="{% url 'online-article' article.slug %}">{% if article.image %}<img loading="lazy" src="{% url 'online-image' 'article' article.pk %}" alt="{{ article.title }}">{% else %}<div class="card-art story-art" aria-hidden="true">≈</div>{% endif %}<div class="card-copy"><p class="eyebrow">{% ot "CHUYỆN HỘI AN" "HOI AN STORIES" %}</p><h3>{{ article.title }}</h3><p>{{ article.summary }}</p><span class="text-link">{% ot "Đọc câu chuyện →" "Read the story →" %}</span></div></a></article>

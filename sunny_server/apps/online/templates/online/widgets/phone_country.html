<div class="phone-country-picker"><div class="phone-country-input"><input type="text" name="{{ widget.name }}" value="{{ widget.value|default_if_none:'' }}"{% include "django/forms/widgets/attrs.html" %} aria-controls="{{ widget.attrs.id }}_options" aria-autocomplete="list"><button type="button" aria-label="{{ widget.toggle }}" aria-expanded="false">⌄</button></div><div class="phone-country-options" id="{{ widget.attrs.id }}_options" role="listbox" hidden>{% for country in widget.countries %}<button type="button" role="option" data-search="{{ country.search }}" data-value="{{ country.value }}" aria-selected="false">{{ country.value }}</button>{% endfor %}</div></div>
